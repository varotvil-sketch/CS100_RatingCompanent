<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>Rating Component</title>
</head>

<body>
  <header>
    <div class="container ">
      <div class="card bg-light rounded-4 border-0 shadow-lg mt-5">
        <div class="card-body">
          <div class="row p-5">
            <div class="col-7">
              <h2 class=" fw-semibold">What other's think about the product</h2>
            </div>
            <div class="col-5">
              <div class="card">
                <div class="card-body text-center">
                  <h2 class="display-5 fw-semibold"><i class="fa-solid fa-star text-warning"></i>4.8</h2>
                  <p>Average Rating</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Search Reviews -->
          <div class="row">
            <div class="col-12">
              <div class="input-group input-group-lg">
                <span class="input-group-text rounded-start-5"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" class="form-control rounded-end-5" placeholder="Search Reviews">
              </div>
            </div>
          </div>

          <!-- Rating Distribution-->
          <div class="row p-5">
            <div class="col-12 vstack gap-2">
              <h2>rating</h2>
              <!-- Rating Level 5 -->
              <div class="d-flex align-items-center gap-2">
                <span>5 <i class="fa-solid fa-star text-warning"></i></span>
                <div class="progress flex-grow-1" role="progressbar" style="height: 10px" aria-valuenow="80" aria-valuemin="0"
                  aria-valuemax="100">
                  <div class="progress-bar bg-warning" style="width: 80%"></div>
                </div>
              </div>
              <!-- Rating Level 4 -->
              <div class="d-flex align-items-center gap-2">
                <span>4 <i class="fa-solid fa-star text-warning"></i></span>
                <div class="progress flex-grow-1 " role="progressbar" style="height: 10px" aria-valuenow="60" aria-valuemin="0"
                  aria-valuemax="100">
                  <div class="progress-bar bg-warning" style="width: 60%"></div>
                </div>
              </div>
              <!-- Rating Level 3 -->
              <div class="d-flex align-items-center gap-2">
                <span>3 <i class="fa-solid fa-star text-warning"></i></span>
                <div class="progress flex-grow-1" role="progressbar" style="height: 10px" aria-valuenow="20" aria-valuemin="0"
                  aria-valuemax="100">
                  <div class="progress-bar bg-warning" style="width: 20%"></div>
                </div>
              </div>
              <!-- Rating Level 2 -->
              <div class="d-flex align-items-center gap-2">
                <span>2 <i class="fa-solid fa-star text-warning"></i></span>
                <div class="progress flex-grow-1" role="progressbar" style="height: 10px" aria-valuenow="10" aria-valuemin="0"
                  aria-valuemax="100">
                  <div class="progress-bar bg-warning" style="width: 10%"></div>
                </div>
              </div>
              <!-- Rating Level 1 -->
              <div class="d-flex align-items-center gap-2">
                <span>1 <i class="fa-solid fa-star text-warning"></i></span>
                <div class="progress flex-grow-1" role="progressbar" style="height: 10px" aria-valuenow="27" aria-valuemin="0"
                  aria-valuemax="100">
                  <div class="progress-bar bg-warning" style="width: 27%"></div>
                </div>
              </div>
            </div>
          </div>
          <!-- Buttom Write Reviews -->
          <div class="row px-5 pb-4">
            <div class="col-12">
              <div class="btn btn-success btn-lg rounded-5">Write Reviews</div>
            </div>
          </div>
          
        </div>
      </div>
    </div>
  </header>

  <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
